<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Flood Notification System</title>
<style>
  :root{
    --ink:#1B2430; --ink-soft:#4C5666; --paper:#F2EFE8; --card:#FFFFFF; --line:#DCD7CB;
    --alert:#B3311F; --alert-tint:#FBE9E6; --brand:#2C5F73; --brand-tint:#E3EEF1;
    --up:#C1481E; --down:#3060B0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){ --ink:#ECE7DC; --ink-soft:#B9B2A2; --paper:#181613; --card:#221F1A; --line:#38342C; --alert-tint:#301613; --brand-tint:#132A32; }
  }
  :root[data-theme="dark"]{ --ink:#ECE7DC; --ink-soft:#B9B2A2; --paper:#181613; --card:#221F1A; --line:#38342C; --alert-tint:#301613; --brand-tint:#132A32; }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;background:#DCD7CB;color:var(--ink);}
  body{display:flex; justify-content:center; align-items:center; min-height:100vh; padding:24px; -webkit-font-smoothing:antialiased;}
  .frame{width:390px; height:844px; margin:0 auto; background:var(--paper); border:1px solid var(--line); border-radius:34px; overflow:hidden; box-shadow:0 20px 50px rgba(0,0,0,.25); display:flex; flex-direction:column;}
  .screen{flex:1; overflow-y:auto; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);}

  /* Language screen */
  .langwrap{padding:calc(48px + env(safe-area-inset-top,0px)) 22px 24px;}
  .langwrap h1{font-size:24px; font-weight:800; margin:0 0 6px;}
  .langwrap p{font-size:14px; color:var(--ink-soft); margin:0 0 22px;}
  .langopt{display:block; width:100%; text-align:left; background:var(--card); border:1px solid var(--line); border-radius:10px; padding:14px 16px; font-size:16px; font-weight:700; color:var(--ink); margin-bottom:10px; cursor:pointer;}
  .langopt:hover{border-color:var(--brand);}
  .langopt small{display:block; font-weight:500; font-size:12px; color:var(--ink-soft); margin-top:2px;}

  .topbar{position:sticky; top:0; z-index:5; padding:calc(14px + env(safe-area-inset-top,0px)) 20px 12px; background:var(--paper); border-bottom:1px solid var(--line); display:flex; align-items:center; gap:10px;}
  .topbar h1{margin:0; font-size:19px; font-weight:800; flex:1;}
  .backbtn,.langbtn{background:none; border:none; cursor:pointer; color:var(--ink); padding:2px; display:flex; align-items:center; gap:5px; font-size:13px; font-weight:700;}
  .backbtn:focus-visible,.langbtn:focus-visible{outline:2px solid var(--ink); outline-offset:2px;}

  .section-label{padding:20px 20px 6px; font-size:13px; font-weight:700; color:var(--ink-soft); text-transform:uppercase; letter-spacing:.06em;}

  .warning-head{display:flex; align-items:flex-start; gap:10px; padding:16px 18px 8px; color:var(--alert);}
  .warning-head .who{font-size:16px; font-weight:800; line-height:1.3;}
  .warning-sub{padding:0 18px 4px; font-size:12.5px; color:var(--ink-soft); font-weight:600; display:flex; justify-content:space-between;}
  .warning-body{padding:8px 18px 16px; font-size:13.5px; line-height:1.55; white-space:pre-line; flex:1; overflow-y:auto;}
  .warning-foot{display:flex; justify-content:flex-end; padding:0 18px 16px;}
  .btn-read{border:none; border-radius:7px; padding:9px 16px; font-size:13.5px; font-weight:700; background:var(--alert); color:#fff; cursor:pointer;}

  .noticebox{margin:6px 16px 0;}
  .noticelist{margin-top:0;}
  .warning{margin:0; border-radius:12px; background:var(--alert-tint); border:1px solid var(--alert); overflow:hidden; flex:1; display:flex; flex-direction:column; box-shadow:0 14px 30px rgba(179,49,31,0.22);}
  .noticerow{background:var(--card); border:1px solid var(--line); border-radius:9px; margin-bottom:8px; overflow:hidden;}
  .noticerow-head{display:flex; align-items:center; gap:10px; padding:12px 14px; cursor:pointer; background:none; border:none; width:100%; text-align:left; font:inherit; color:inherit;}
  .noticerow-head .tag{width:8px; height:8px; border-radius:50%; background:var(--ink-soft); flex:none;}
  .noticerow-head.was-alert .tag{background:var(--alert);}
  .noticerow-head .title{flex:1; font-size:14px; font-weight:700;}
  .noticerow-head .date{font-size:12px; color:var(--ink-soft); flex:none;}
  .noticerow-head .caret{color:var(--ink-soft); transition:transform .15s ease; flex:none;}
  .noticerow-head[aria-expanded="true"] .caret{transform:rotate(180deg);}
  .noticerow-body{max-height:0; overflow:hidden; transition:max-height .18s ease;}
  .noticerow-body.open{max-height:340px; overflow-y:auto;}
  .noticerow-body .inner{padding:0 14px 14px; font-size:13.5px; line-height:1.55; color:var(--ink-soft); white-space:pre-line;}

  .postlist{margin:6px 16px 0; max-height:420px; overflow-y:auto; border:1px solid var(--line); border-radius:10px; padding:8px; background:rgba(0,0,0,0.015);}
  .postlist .postcard:last-child{margin-bottom:0;}
  .postcard{background:var(--card); border:1px solid var(--line); border-radius:10px; padding:14px; margin-bottom:10px; cursor:pointer;}
  .postcard h3{margin:0 0 5px; font-size:15.5px; font-weight:800; line-height:1.3;}
  .postcard .preview{margin:0; font-size:13.5px; line-height:1.5; color:var(--ink-soft); display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden;}
  .postcard .meta{margin-top:8px; font-size:12px; color:var(--ink-soft); display:flex; gap:10px; align-items:center;}
  .xlate-badge{font-size:11px; font-weight:700; color:var(--brand); background:var(--brand-tint); border:none; border-radius:6px; padding:2px 7px; cursor:pointer; display:inline-flex; align-items:center; gap:3px;}
  .xlate-badge.on{background:var(--brand); color:#fff;}

  .post{margin:6px 16px 0; background:var(--card); border:1px solid var(--line); border-radius:10px; padding:16px;}
  .post h2{margin:0 0 8px; font-size:17px; font-weight:800; line-height:1.3;}
  .post p{margin:0; font-size:14.5px; line-height:1.55;}
  .post-meta{margin-top:10px; font-size:12px; color:var(--ink-soft); display:flex; gap:8px; align-items:center;}

  .comments{margin:10px 16px 0; padding-bottom:6px;}
  .comment{display:flex; gap:10px; padding:12px 4px; border-bottom:1px solid var(--line);}
  .comment:last-child{border-bottom:none;}
  .votecol{display:flex; flex-direction:column; align-items:center; gap:2px; padding-top:2px; flex:none;}
  .votebtn{background:none; border:none; cursor:pointer; padding:3px; line-height:0; color:var(--ink-soft); border-radius:5px;}
  .votebtn:hover{background:var(--brand-tint);}
  .votebtn.on-up{color:var(--up);} .votebtn.on-down{color:var(--down);}
  .score{font-size:12.5px; font-weight:700;}
  .commbody{flex:1; min-width:0;}
  .commbody .author{font-size:13.5px; font-weight:700;}
  .commbody .date{font-size:11.5px; color:var(--ink-soft); font-weight:500; margin-left:6px;}
  .commbody .text{font-size:14px; line-height:1.5; margin:3px 0 6px;}
  .commbody .actions{display:flex; gap:14px;}
  .linklike{background:none; border:none; padding:0; font-size:12.5px; font-weight:700; color:var(--ink-soft); cursor:pointer;}
  .linklike:hover{color:var(--brand);}
  .replybox{display:none; margin-top:8px; gap:8px; flex-direction:column;}
  .replybox.open{display:flex;}
  .replybox textarea{resize:vertical; min-height:54px; border:1px solid var(--line); border-radius:7px; padding:8px 10px; font-size:13.5px; font-family:inherit; background:var(--paper); color:var(--ink);}
  .replybox .row{display:flex; gap:8px; justify-content:flex-end;}
  .btn-mini{border:1px solid var(--line); background:var(--card); color:var(--ink); font-size:12.5px; font-weight:700; padding:6px 12px; border-radius:6px; cursor:pointer;}
  .btn-mini.primary{background:var(--brand); border-color:var(--brand); color:#fff;}
  .replies{margin-top:10px; padding-left:14px; border-left:2px solid var(--line);}

  .newcomment{margin:0 16px 28px; background:var(--card); border:1px solid var(--line); border-radius:10px; padding:14px;}
  .newcomment textarea{width:100%; border:1px solid var(--line); border-radius:7px; padding:10px 12px; font-size:14px; font-family:inherit; min-height:64px; resize:vertical; background:var(--paper); color:var(--ink);}
  .newcomment .row{display:flex; justify-content:space-between; align-items:center; margin-top:10px; gap:10px;}
  .newcomment .hint{font-size:12px; color:var(--ink-soft);}

  .tabbar{display:flex; justify-content:center; padding:14px 0 calc(18px + env(safe-area-inset-bottom,0px));}
  .tabbar .dot{width:34px; height:34px; border-radius:50%; border:1.5px solid var(--ink-soft);}
</style>
</head>

const NOTICES_I18N = {
  "n-flood":{
    en:{ title:"WATCH & ACT - FLASH FLOOD - Stay Indoors",
      body:"Incident Location: Elizabeth Street, Melbourne CBD\nIssue Date: Monday 21 November 2022, 09:50 am\n\nThis Flash Flood Watch and Act is being issued for Elizabeth Street, Melbourne CBD.\n\n- Heavy rainfall overnight has caused flash flooding in Elizabeth Street.\n- Roads currently impacted by floodwater, along Elizabeth Street, include Lonsdale Street and Bourke Street.\n- City of Melbourne Council have opened a relief centre due to some houses being isolated by floodwater at Melbourne Exhibition Centre at South Wharf VIC 3006.\n- You can stay safe by avoiding flooded and low-lying areas.\n- Floodwater can be very deep, rise quickly and move fast.\n- Be aware that heavy rainfall may also increase the potential for debris across roads.\n\nIf you are located along Elizabeth Street, you are in danger. You should immediately move indoors, away from floodwater. Do not enter floodwater." },
    zhHans:{ title:"警戒与行动 - 山洪暴发 - 请留在室内",
      body:"事发地点:墨尔本中央商务区伊丽莎白街\n发布时间:2022年11月21日星期一上午9:50\n\n针对墨尔本中央商务区伊丽莎白街发布本次山洪暴发警戒与行动通知。\n\n- 一夜的强降雨已导致伊丽莎白街发生山洪暴发。\n- 目前受洪水影响的道路,沿伊丽莎白街,包括朗斯代尔街和伯克街。\n- 由于部分住宅被洪水围困,墨尔本市议会已在南码头(邮编3006)的墨尔本会展中心开设了临时安置中心。\n- 请避开被淹没和低洼地区,以确保自身安全。\n- 洪水可能非常深,并会迅速上涨、快速流动。\n- 请注意,强降雨也可能增加道路上出现障碍物的风险。\n\n如果您位于伊丽莎白街一带,您正处于危险之中。请立即转移到室内,远离洪水,切勿进入洪水中。" },
    zhHant:{ title:"警戒與行動 - 山洪暴發 - 請留在室內",
      body:"事發地點:墨爾本中央商務區伊麗莎白街\n發布時間:2022年11月21日星期一上午9:50\n\n針對墨爾本中央商務區伊麗莎白街發布本次山洪暴發警戒與行動通知。\n\n- 一夜的強降雨已導致伊麗莎白街發生山洪暴發。\n- 目前受洪水影響的道路,沿伊麗莎白街,包括朗斯代爾街和伯克街。\n- 由於部分住宅被洪水圍困,墨爾本市議會已在南碼頭(郵遞區號3006)的墨爾本會展中心開設了臨時安置中心。\n- 請避開被淹沒和低窪地區,以確保自身安全。\n- 洪水可能非常深,並會迅速上漲、快速流動。\n- 請注意,強降雨也可能增加道路上出現障礙物的風險。\n\n如果您位於伊麗莎白街一帶,您正處於危險之中。請立即轉移到室內,遠離洪水,切勿進入洪水中。" },
    hi:{ title:"चेतावनी और कार्रवाई - अचानक बाढ़ - घर के अंदर रहें",
      body:"घटना स्थान: एलिज़ाबेथ स्ट्रीट, मेलबर्न सीबीडी\nजारी करने की तिथि: सोमवार, 21 नवंबर 2022, सुबह 09:50 बजे\n\nयह फ्लैश फ्लड वॉच एंड एक्ट एलिज़ाबेथ स्ट्रीट, मेलबर्न सीबीडी के लिए जारी किया जा रहा है।\n\n- रात भर हुई भारी बारिश के कारण एलिज़ाबेथ स्ट्रीट में अचानक बाढ़ आ गई है।\n- एलिज़ाबेथ स्ट्रीट के साथ-साथ फिलहाल बाढ़ के पानी से प्रभावित सड़कों में लॉन्सडेल स्ट्रीट और बर्क स्ट्रीट शामिल हैं।\n- कुछ घरों के बाढ़ के पानी से घिर जाने के कारण सिटी ऑफ मेलबर्न काउंसिल ने साउथ वार्फ, वीआईसी 3006 स्थित मेलबर्न एग्ज़िबिशन सेंटर में एक राहत केंद्र खोला है।\n- बाढ़ग्रस्त और निचले इलाकों से दूर रहकर आप सुरक्षित रह सकते हैं।\n- बाढ़ का पानी बहुत गहरा हो सकता है, और तेज़ी से बढ़ और बह सकता है।\n- ध्यान रखें कि भारी बारिश से सड़कों पर मलबा आने की संभावना भी बढ़ सकती है।\n\nयदि आप एलिज़ाबेथ स्ट्रीट के आस-पास हैं, तो आप खतरे में हैं। आपको तुरंत घर के अंदर, बाढ़ के पानी से दूर चले जाना चाहिए। बाढ़ के पानी में प्रवेश न करें।" },
    es:{ title:"Vigile y Actúe - Inundación Repentina - Permanezca en Interiores",
      body:"Ubicación del incidente: Elizabeth Street, CBD de Melbourne\nFecha de emisión: lunes 21 de noviembre de 2022, 09:50 am\n\nSe emite esta alerta de Vigile y Actúe por inundación repentina para Elizabeth Street, CBD de Melbourne.\n\n- Las fuertes lluvias durante la noche han causado inundaciones repentinas en Elizabeth Street.\n- Las calles actualmente afectadas por el agua de la inundación, a lo largo de Elizabeth Street, incluyen Lonsdale Street y Bourke Street.\n- El Concejo de la Ciudad de Melbourne ha abierto un centro de asistencia debido a que algunas viviendas quedaron aisladas por el agua, en el Melbourne Exhibition Centre, South Wharf VIC 3006.\n- Puede mantenerse a salvo evitando las zonas inundadas y las áreas bajas.\n- El agua de la inundación puede ser muy profunda, subir rápidamente y moverse con fuerza.\n- Tenga en cuenta que las fuertes lluvias también pueden aumentar la presencia de escombros en las calles.\n\nSi se encuentra en Elizabeth Street, está en peligro. Debe trasladarse de inmediato a un lugar cerrado, lejos del agua de la inundación. No entre en el agua de la inundación." }

  "n-severeweather":{

    zhHans:{ title:"建议 - 恶劣天气 - 请保持关注",
      body:"事发地点:墨尔本中央商务区,包括伊丽莎白街\n发布时间:2022年7月23日星期六下午2:15\n下次更新:2022年7月23日星期六晚上8:00\n\n澳大利亚气象局已针对包括伊丽莎白街在内的墨尔本中央商务区发布恶劣天气警报。\n- 今天下午及傍晚可能出现可导致山洪暴发的强降雨。\n- 包括伊丽莎白街、朗斯代尔街和伯克街在内的道路可能出现局部积水。\n- 请在安全的情况下清理排水沟,并避免在低洼地区停车。\n\n请注意强降雨可能带来的危险,包括路面积水和障碍物。" },
    zhHant:{ title:"建議 - 惡劣天氣 - 請保持關注",

function load(){ try{ const raw = localStorage.getItem(STORE_KEY); if(raw) return JSON.parse(raw); }catch(e){} return seed(); }
function save(){ try{ localStorage.setItem(STORE_KEY, JSON.stringify(state)); }catch(e){} }
function loadLang(){ try{ return localStorage.getItem(LANG_KEY); }catch(e){ return null; } }
function saveLang(l){ try{ localStorage.setItem(LANG_KEY, l); }catch(e){} }

let state = load();
let lang = loadLang();
let view = { screen:"lang", postId:null };
let expandedNotice = null;
let translatedShown = new Set(); // ids currently showing ORIGINAL text (toggled off translation)

function toggleOriginal(id, e){ if(e) e.stopPropagation(); if(translatedShown.has(id)) translatedShown.delete(id); else translatedShown.add(id); renderApp(); }

function postHasTranslation(p){ return !!(p.content && p.origLang !== lang && p.content.title[lang]); }
function getPostField(p, field){
  if(!p.content) return p[field];
  const dict = p.content[field];
  if(lang === p.origLang) return dict[p.origLang];
  if(!dict[lang]) return dict[p.origLang];
  return translatedShown.has(p.id) ? dict[p.origLang] : dict[lang];
}
function commentHasTranslation(c){ return !!(c.content && c.origLang !== lang && c.content.text[lang]); }
function getCommentField(c){
  if(!c.content) return c.text;
  const dict = c.content.text;
  if(lang === c.origLang) return dict[c.origLang];
  if(!dict[lang]) return dict[c.origLang];
  return translatedShown.has(c.id) ? dict[c.origLang] : dict[lang];
}
function xlateBadge(id, isOn){
  return `<button class="xlate-badge ${isOn?'on':''}" onclick='toggleOriginal("${id}",event)' title="${isOn ? 'Show translation' : 'Show original'}">🌐</button>`;
}

function t(){ return UI[lang] || UI.en; }
function escapeHtml(s){ return s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }
function score(c){ return c.up - c.down; }

function chooseLang(code){ lang = code; saveLang(code); state.activeNoticeRead = false; expandedNotice = null; save(); view = {screen:"home", postId:null}; renderApp(); }
function goChangeLang(){ view = {screen:"lang", postId:null}; renderApp(); }
function markRead(){ state.activeNoticeRead = true; save(); renderApp(); }
function markUnread(e){ if(e) e.stopPropagation(); state.activeNoticeRead = false; expandedNotice = null; save(); renderApp(); window.scrollTo(0,0); }
function toggleNoticeRow(id){ expandedNotice = expandedNotice === id ? null : id; renderApp(); }
function openPost(id){ view = {screen:"post", postId:id}; renderApp(); window.scrollTo(0,0); }
function goHome(){ view = {screen:"home", postId:null}; renderApp(); window.scrollTo(0,0); }

function findReplyList(list, path){ let cur = list; for(const id of path){ const node = cur.find(x=>x.id===id); if(!node) return list; cur = node.replies; } return cur; }
function vote(postId, id, dir, path){
  const post = state.posts.find(p=>p.id===postId);
  const list = path.length ? findReplyList(post.comments, path) : post.comments;
  const c = list.find(x=>x.id===id); if(!c) return;
  if(c.myVote === dir){ if(dir===1) c.up--; else c.down--; c.myVote = 0; }
  else{ if(c.myVote===1) c.up--; if(c.myVote===-1) c.down--; if(dir===1) c.up++; else c.down++; c.myVote = dir; }
  save(); renderApp();
}
function toggleReply(id){ const box = document.getElementById("reply-"+id); if(box) box.classList.toggle("open"); }
function submitReply(postId, id, path){
  const ta = document.getElementById("reply-input-"+id);
  const text = ta.value.trim(); if(!text) return;
  const post = state.posts.find(p=>p.id===postId);
  const list = path.length ? findReplyList(post.comments, path) : post.comments;
  const parent = list.find(x=>x.id===id); if(!parent) return;
  parent.replies.push(mkc("You", text, "now"));
  save(); renderApp();
}
function addComment(postId){
  const ta = document.getElementById("newText");
  const text = ta.value.trim(); if(!text) return;
  const post = state.posts.find(p=>p.id===postId);
  post.comments.push(mkc("You", text, "now"));
  save(); renderApp();
}

function renderComment(postId, c, path){
  const fullPath = path.concat([c.id]);
  const pathJson = JSON.stringify(path);
  const s = t();
  return `
    <div class="comment">
      <div class="votecol">
        <button class="votebtn ${c.myVote===1?'on-up':''}" aria-label="Upvote" onclick='vote("${postId}","${c.id}",1,${pathJson})'>
          <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><path d="M12 4l8 10h-5v6H9v-6H4z"/></svg>
        </button>
        <span class="score">${score(c)}</span>
        <button class="votebtn ${c.myVote===-1?'on-down':''}" aria-label="Downvote" onclick='vote("${postId}","${c.id}",-1,${pathJson})'>
          <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><path d="M12 20l-8-10h5V4h6v6h5z"/></svg>
        </button>
      </div>
      <div class="commbody">
        <span class="author">${escapeHtml(c.author)}</span><span class="date">${escapeHtml(c.date)}</span>
        <div class="text">${escapeHtml(getCommentField(c))} ${commentHasTranslation(c) ? xlateBadge(c.id, translatedShown.has(c.id)) : ""}</div>
        <div class="actions"><button class="linklike" onclick='toggleReply("${c.id}")'>${s.reply}</button></div>
        <div class="replybox" id="reply-${c.id}">
          <textarea id="reply-input-${c.id}" placeholder="${s.writeReply}"></textarea>
          <div class="row">
            <button class="btn-mini" onclick='toggleReply("${c.id}")'>${s.cancel}</button>
            <button class="btn-mini primary" onclick='submitReply("${postId}","${c.id}",${pathJson})'>${s.reply}</button>
          </div>
        </div>
        ${c.replies.length ? `<div class="replies">${c.replies.map(r=>renderComment(postId, r, fullPath)).join("")}</div>` : ""}
      </div>
    </div>`;
}

function renderLangScreen(){
  return `
    <div class="langwrap">
      <h1>Flood Notification System</h1>
      <p>Choose your language / 选择您的语言 / अपनी भाषा चुनें / Elige tu idioma</p>
      ${LANGS.map(l => `<button class="langopt" onclick='chooseLang("${l.code}")'>${l.label}${l.sub ? `<small>${l.sub}</small>` : ""}</button>`).join("")}
    </div>`;
}

function renderHome(){
  const s = t();
  const activeNotice = NOTICES_I18N["n-flood"][lang] || NOTICES_I18N["n-flood"].en;
  const activeMeta = state.notices.find(n=>n.id==="n-flood");
  const collapsedNotices = state.activeNoticeRead ? [...state.notices].sort((a,b)=>a.ageMin-b.ageMin) : [];

  const activeHtml = state.activeNoticeRead ? "" : `
    <div class="warning">
      <div class="warning-head">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10.29 3.86 1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>
        <span class="who">${escapeHtml(activeNotice.title)}</span>
      </div>
      <div class="warning-body">${escapeHtml(activeNotice.body)}</div>
      <div class="warning-foot"><button class="btn-read" onclick="markRead()">${s.markRead}</button></div>
    </div>`;

  const rowsHtml = collapsedNotices.map(n => {
    const tr = NOTICES_I18N[n.id][lang] || NOTICES_I18N[n.id].en;
    return `
    <div class="noticerow">
      <button class="noticerow-head ${n.wasAlert?'was-alert':''}" aria-expanded="${expandedNotice===n.id}" onclick='toggleNoticeRow("${n.id}")'>
        <span class="tag"></span>
        <span class="title">${escapeHtml(tr.title)}</span>
        <span class="date">${escapeHtml(n.date)}</span>
        <svg class="caret" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"></polyline></svg>
      </button>
      <div class="noticerow-body ${expandedNotice===n.id ? 'open' : ''}">
        <div class="inner">${escapeHtml(tr.body)}
        ${n.id==="n-flood" ? `<div style="margin-top:10px;"><button class="btn-mini" onclick='markUnread(event)'>${s.markUnread}</button></div>` : ""}
        </div>
      </div>
    </div>`;
  }).join("");

  const postsHtml = [...state.posts].sort((a,b)=>a.ageMin-b.ageMin).map(p => `
    <div class="postcard" tabindex="0" role="button" onclick='openPost("${p.id}")' onkeypress='if(event.key==="Enter") openPost("${p.id}")'>
      <h3>${escapeHtml(getPostField(p,"title"))} ${postHasTranslation(p) ? xlateBadge(p.id, translatedShown.has(p.id)) : ""}</h3>
      <p class="preview">${escapeHtml(getPostField(p,"body"))}</p>
      <div class="meta"><span>${p.comments.length} ${s.commentsWord}</span><span>${escapeHtml(p.date)}</span></div>
    </div>`).join("");

  return `
    <div class="topbar" style="justify-content:flex-end;">
      <button class="langbtn" onclick="goChangeLang()">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M2 12h20M12 2a15 15 0 0 1 0 20 15 15 0 0 1 0-20z"/></svg>
        ${s.changeLang}
      </button>
    </div>
    <div class="section-label">${s.notice}</div>
    <div class="noticebox ${state.activeNoticeRead ? '' : 'is-unread'}">
      ${activeHtml}
      ${rowsHtml ? `<div class="noticelist">${rowsHtml}</div>` : ""}
    </div>
    <div class="section-label">${s.discussion}</div>
    <div class="postlist">${postsHtml}</div>
    <div class="tabbar"><div class="dot"></div></div>
  `;
}

function renderPost(id){
  const s = t();
  const p = state.posts.find(x=>x.id===id);
  const sorted = [...p.comments].sort((a,b)=>score(b)-score(a));
  return `
    <div class="topbar">
      <button class="backbtn" onclick="goHome()" aria-label="Back">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"></polyline></svg>
      </button>
      <h1>${s.discussion}</h1>
    </div>
    <div class="post">
      <h2>${escapeHtml(getPostField(p,"title"))} ${postHasTranslation(p) ? xlateBadge(p.id, translatedShown.has(p.id)) : ""}</h2>
      <p>${escapeHtml(getPostField(p,"body"))}</p>
      <div class="post-meta"><span>${s.postedBy} · ${escapeHtml(p.date)}</span></div>
    </div>
    <div class="comments">${sorted.map(c=>renderComment(p.id, c, [])).join("")}</div>
    <div class="newcomment">
      <textarea id="newText" placeholder="${s.shareUpdate}"></textarea>
      <div class="row"><span class="hint">${s.visibleHint}</span>
      <button class="btn-mini primary" onclick='addComment("${p.id}")'>${s.comment}</button></div>
    </div>
    <div class="tabbar"><div class="dot"></div></div>
  `;
}

function renderApp(){
  const el = document.getElementById("app");
  if(view.screen === "lang") el.innerHTML = renderLangScreen();
  else if(view.screen === "post") el.innerHTML = renderPost(view.postId);
  else el.innerHTML = renderHome();
}
renderApp();
</script>
